<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>더블러섬 | 양변기 부속 전문</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/premium.css">   <!-- 고급형 디자인 (style.css 뒤에 불러와서 덮어씀) -->
</head>
<body class="pm">
  <!-- [헤더] 로고 / 검색 / 로그인·회원가입·장바구니 -->
  <header class="pm-top"><div class="pm-top-in">
    <a class="pm-logo" href="#/" aria-label="더블러섬 홈">
      <img src="assets/logo.png" alt="The blossom 로고" width="64" height="64">
      <span class="pm-brand"><b>더블러섬</b><small>The Blossom</small></span>
    </a>
    <div class="pm-search">
      <input id="pm-q" type="search" placeholder="상품명 / 규격으로 검색하세요" autocomplete="off" aria-label="상품 검색">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </div>
    <nav class="pm-util" aria-label="회원 메뉴">
      <span id="user-info"></span>
      <button id="btn-login" type="button"></button><i class="sep"></i>
      <button id="pm-join" type="button">회원가입</button><i class="sep"></i>
      <button id="btn-cart" type="button" class="pm-cartbtn" aria-label="장바구니">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
        <b id="cart-count">0</b>
      </button>
    </nav>
  </div></header>

  <!-- [카테고리 메뉴] 가로 메뉴 + 전체카테고리 펼침 : js/themes/premium.js 가 채움 -->
  <nav class="pm-nav" aria-label="카테고리"><div class="pm-nav-in">
    <button id="pm-all" class="pm-all" type="button" aria-expanded="false" aria-controls="pm-mega">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>전체카테고리
    </button>
    <ul id="pm-nav-list" class="pm-nav-list"></ul>
  </div>
  <div id="pm-mega" class="pm-mega" hidden><ul id="pm-mega-list"></ul></div></nav>

  <!-- [상품 목록] -->
  <main class="pm-main">
    <h1 id="list-title" class="pm-title"></h1>
    <div class="pm-bar">
      <span>총 <b id="pm-count">0</b>개</span>
      <label>정렬 <select id="pm-sort">
        <option value="default">추천순</option><option value="low">낮은 가격순</option>
        <option value="high">높은 가격순</option><option value="name">이름순</option>
      </select></label>
    </div>
    <div id="product-grid" class="pm-grid"></div>
  </main>

  <!-- [하단 사업자 정보] 아래 괄호 부분을 실제 정보로 바꾸세요 (법적 표기 사항) -->
  <footer class="pm-foot"><div class="pm-foot-in">
    <b>더블러섬</b>
    <p>상호: 더블러섬 &nbsp;|&nbsp; 대표: (입력) &nbsp;|&nbsp; 사업자등록번호: (입력) &nbsp;|&nbsp; 통신판매업신고: (입력)<br>
       주소: (입력) &nbsp;|&nbsp; 전화: (입력) &nbsp;|&nbsp; 이메일: (입력)</p>
    <p>© 더블러섬. All rights reserved.</p>
  </div></footer>

  <!-- [장바구니 패널] / [상품 상세 팝업]: 기존 index.html 과 동일한 부품 -->
  <section id="cart-panel" class="cart" hidden>
    <h2>장바구니</h2><div id="cart-items"></div>
    <p class="total">합계 <b id="cart-total">0</b>원</p>
    <button id="btn-checkout" type="button">주문하기 (추후 구현)</button>
    <button id="btn-cart-close" type="button">닫기</button>
  </section>
  <dialog id="detail"></dialog>

  <!-- 스크립트 순서 중요: 카테고리 → 설정 → 상품 → 모듈 → 고급형 화면 → main -->
  <script src="js/data/categories.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data/products.js"></script>
  <script src="js/modules/auth.js"></script>
  <script src="js/modules/pricing.js"></script>
  <script src="js/modules/cart.js"></script>
  <script src="js/modules/catalog.js"></script>
  <script src="js/themes/premium.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
